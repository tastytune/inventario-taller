<style>
  :root{
    --bg:#0a0f0d;
    --panel:#0f1613;
    --panel-2:#131d18;
    --edge:#20302a;
    --copper:#c88a4a;
    --copper-dim:#8a6236;
    --trace:#d8ff5a;
    --trace-dim:#7d9138;
    --ink:#e8f0e6;
    --ink-dim:#8ba095;
    --ink-faint:#5c7268;
    --danger:#ff6b57;
    --plastic:#5ec8e5;
    --amarilla:#f2c14e;
    --mono:'IBM Plex Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.45;overscroll-behavior-y:none}
  body{padding:0 0 96px;max-width:820px;margin:0 auto;
    background-image:radial-gradient(circle at 12% 0%,rgba(216,255,90,.04),transparent 40%),
                     radial-gradient(circle at 90% 8%,rgba(200,138,74,.05),transparent 45%)}

  /* ---- Cabecera ---- */
  header{position:sticky;top:0;z-index:30;
    background:linear-gradient(180deg,rgba(10,15,13,.97),rgba(10,15,13,.88));
    backdrop-filter:blur(8px);border-bottom:1px solid var(--edge);
    padding:calc(env(safe-area-inset-top) + 14px) 18px 12px}
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .brand h1{font-family:var(--mono);font-weight:600;font-size:1.15rem;
    letter-spacing:.02em;color:var(--ink)}
  .brand h1 .dot{color:var(--trace)}
  .brand .sub{font-family:var(--mono);font-size:.66rem;letter-spacing:.22em;
    text-transform:uppercase;color:var(--ink-faint)}
  .counts{display:flex;gap:14px;margin-top:10px;font-family:var(--mono);
    font-size:.7rem;letter-spacing:.04em;color:var(--ink-dim);flex-wrap:wrap}
  .counts b{color:var(--trace);font-weight:600}
  .counts .pill{display:inline-flex;align-items:center;gap:5px}
  .swatch{width:9px;height:9px;border-radius:2px;display:inline-block}

  /* ---- Controles ---- */
  .controls{padding:14px 18px 4px;display:flex;flex-direction:column;gap:10px}
  .search{position:relative}
  .search input{width:100%;background:var(--panel);border:1px solid var(--edge);
    border-radius:10px;color:var(--ink);font-family:var(--mono);font-size:.9rem;
    padding:12px 14px 12px 38px;outline:none;transition:border-color .15s}
  .search input:focus{border-color:var(--trace-dim)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;stroke:var(--ink-faint);fill:none;stroke-width:2}
  .filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;
    scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{flex:none;font-family:var(--mono);font-size:.72rem;letter-spacing:.02em;
    padding:7px 12px;border-radius:999px;border:1px solid var(--edge);
    background:transparent;color:var(--ink-dim);cursor:pointer;white-space:nowrap;
    transition:all .13s}
  .chip[aria-pressed="true"]{background:var(--trace);color:#0a0f0d;
    border-color:var(--trace);font-weight:600}
  .chip.loc-plastic[aria-pressed="true"]{background:var(--plastic);border-color:var(--plastic)}
  .chip.loc-amarilla[aria-pressed="true"]{background:var(--amarilla);border-color:var(--amarilla)}

  /* ---- Lista ---- */
  main{padding:8px 14px 0}
  .group-label{font-family:var(--mono);font-size:.68rem;letter-spacing:.2em;
    text-transform:uppercase;color:var(--ink-faint);padding:16px 6px 8px;
    display:flex;align-items:center;gap:10px}
  .group-label::after{content:"";flex:1;height:1px;background:var(--edge)}

  .card{position:relative;background:var(--panel);border:1px solid var(--edge);
    border-radius:12px;padding:14px 15px 13px;margin-bottom:9px;cursor:pointer;
    transition:border-color .15s,transform .05s;overflow:hidden}
  .card:active{transform:scale(.994)}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--cat-color,var(--copper))}
  .card .row1{display:flex;align-items:flex-start;gap:10px}
  .card .name{font-weight:600;font-size:1.02rem;letter-spacing:-.01em;flex:1;
    line-height:1.25}
  .qty{font-family:var(--mono);font-weight:600;font-size:.82rem;
    color:var(--trace);background:rgba(216,255,90,.09);
    border:1px solid rgba(216,255,90,.22);border-radius:7px;
    padding:3px 8px;white-space:nowrap;flex:none}
  .qty.single{color:var(--ink-dim);background:transparent;border-color:var(--edge)}
  .card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
  .tag{font-family:var(--mono);font-size:.68rem;letter-spacing:.02em;
    padding:3px 7px;border-radius:5px;background:var(--panel-2);
    color:var(--ink-dim);border:1px solid var(--edge)}
  .tag.cat{color:var(--cat-color,var(--copper));
    border-color:color-mix(in srgb,var(--cat-color,var(--copper)) 35%,transparent)}
  .tag.loc{display:inline-flex;align-items:center;gap:5px}
  .tag.model{color:var(--copper)}
  .state-new{color:var(--trace)}
  .state-used{color:var(--ink-dim)}
  .state-check{color:var(--amarilla)}

  .empty{text-align:center;padding:60px 24px;color:var(--ink-faint);
    font-family:var(--mono);font-size:.85rem;line-height:1.7}
  .empty svg{width:40px;height:40px;stroke:var(--edge);fill:none;stroke-width:1.5;
    margin-bottom:14px}

  /* ---- Botón flotante ---- */
  .fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);
    z-index:40;width:58px;height:58px;border-radius:17px;border:none;
    background:var(--trace);color:#0a0f0d;font-size:2rem;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 6px 22px rgba(216,255,90,.25),0 2px 6px rgba(0,0,0,.4);
    transition:transform .1s}
  .fab:active{transform:scale(.92)}

  /* ---- Hoja modal ---- */
  .scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);
    backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:820px;
    margin:0 auto;background:var(--panel);border-top-left-radius:20px;
    border-top-right-radius:20px;border-top:1px solid var(--edge);
    max-height:92vh;overflow-y:auto;transform:translateY(100%);
    transition:transform .26s cubic-bezier(.32,.72,0,1);
    padding-bottom:calc(env(safe-area-inset-bottom) + 20px)}
  .sheet.open{transform:translateY(0)}
  .grip{width:38px;height:4px;border-radius:2px;background:var(--edge);
    margin:10px auto 4px}
  .sheet-body{padding:8px 20px 20px}
  .sheet h2{font-size:1.3rem;font-weight:600;letter-spacing:-.01em;
    margin:6px 0 14px;line-height:1.2}
  .field{margin-bottom:14px}
  .field label{display:block;font-family:var(--mono);font-size:.68rem;
    letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
    margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;background:var(--panel-2);
    border:1px solid var(--edge);border-radius:9px;color:var(--ink);
    font-family:var(--sans);font-size:.95rem;padding:11px 12px;outline:none;
    transition:border-color .15s}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--trace-dim)}
  .field textarea{min-height:76px;resize:vertical;font-size:.9rem;line-height:1.5}
  .field.mono input{font-family:var(--mono)}
  .two{display:flex;gap:10px}
  .two .field{flex:1}
  .detail-block{margin-bottom:15px}
  .detail-block .k{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-faint);margin-bottom:3px}
  .detail-block .v{font-size:.98rem;color:var(--ink);line-height:1.5}
  .detail-block .v.notes{color:var(--ink-dim);font-size:.92rem;white-space:pre-wrap}
  .sheet-actions{display:flex;gap:10px;margin-top:18px}
  .btn{flex:1;font-family:var(--mono);font-size:.82rem;letter-spacing:.03em;
    padding:13px;border-radius:10px;border:1px solid var(--edge);cursor:pointer;
    background:var(--panel-2);color:var(--ink);transition:all .13s;font-weight:500}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--trace);color:#0a0f0d;border-color:var(--trace);
    font-weight:600}
  .btn.danger{background:transparent;color:var(--danger);
    border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
  .btn.ghost{background:transparent}
  .qty-stepper{display:flex;align-items:center;gap:0;margin-top:14px;
    border:1px solid var(--edge);border-radius:10px;overflow:hidden;width:fit-content}
  .qty-stepper button{background:var(--panel-2);border:none;color:var(--trace);
    font-size:1.4rem;width:46px;height:44px;cursor:pointer;font-family:var(--mono)}
  .qty-stepper button:active{background:var(--edge)}
  .qty-stepper .val{font-family:var(--mono);font-size:1.1rem;font-weight:600;
    min-width:54px;text-align:center;color:var(--ink)}
  .toolbar{padding:20px 18px 4px;display:flex;gap:9px;justify-content:flex-end}
  .toolbar .btn{flex:none;padding:9px 13px;font-size:.72rem}
  .hint{font-family:var(--mono);font-size:.62rem;color:var(--ink-faint);
    text-align:center;padding:22px 20px 8px;letter-spacing:.03em;line-height:1.8}
</style>
</head>

];

/* ============================================================
   Almacenamiento (IndexedDB, con respaldo automático)
   ============================================================ */
const DB_NAME="banco_taller", STORE="items", DB_VER=1;
let db=null;

function openDB(){
  return new Promise((res,rej)=>{
    const rq=indexedDB.open(DB_NAME,DB_VER);
    rq.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains(STORE))
        d.createObjectStore(STORE,{keyPath:"id",autoIncrement:true});
    };
    rq.onsuccess=e=>{db=e.target.result;res(db);};
    rq.onerror=e=>rej(e.target.error);
  });
}
function tx(mode){return db.transaction(STORE,mode).objectStore(STORE);}
function getAll(){
  return new Promise((res,rej)=>{
    const r=tx("readonly").getAll();
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
}
function put(item){
  return new Promise((res,rej)=>{
    const r=tx("readwrite").put(item);
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
}
function del(id){
  return new Promise((res,rej)=>{
    const r=tx("readwrite").delete(id);
    r.onsuccess=()=>res();r.onerror=()=>rej(r.error);
  });
}
async function seedIfEmpty(){
  const all=await getAll();
  if(all.length===0){
    for(const it of SEED) await put({...it});
  }
}

/* ============================================================
   Estado de UI
   ============================================================ */
let ITEMS=[];
let filterCat="todos";
let filterLoc="todos";
let query="";

const $=s=>document.querySelector(s);
const listEl=$("#list"), countsEl=$("#counts"), filtersEl=$("#filters"),
      hintEl=$("#hint"), scrim=$("#scrim"), sheet=$("#sheet"), sheetBody=$("#sheetBody");

/* ---- Render de filtros ---- */
function renderFilters(){
  const present=new Set(ITEMS.map(i=>i.cat));
  let html=`<button class="chip" data-cat="todos" aria-pressed="${filterCat==='todos'}">Todo</button>`;
  for(const c of CAT_ORDER){
    if(!present.has(c))continue;
    html+=`<button class="chip" data-cat="${c}" aria-pressed="${filterCat===c}">${CATS[c].label}</button>`;
  }
  html+=`<span style="flex:none;width:1px;background:var(--edge);margin:2px 3px"></span>`;
  html+=`<button class="chip loc-plastic" data-loc="plastico" aria-pressed="${filterLoc==='plastico'}">◆ Plástico</button>`;
  html+=`<button class="chip loc-amarilla" data-loc="amarilla" aria-pressed="${filterLoc==='amarilla'}">◆ Amarilla</button>`;
  filtersEl.innerHTML=html;
  filtersEl.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{
    filterCat=b.dataset.cat;render();});
  filtersEl.querySelectorAll("[data-loc]").forEach(b=>b.onclick=()=>{
    filterLoc=filterLoc===b.dataset.loc?"todos":b.dataset.loc;render();});
}

/* ---- Render de contadores ---- */
function renderCounts(){
  const refs=ITEMS.length;
  const units=ITEMS.reduce((s,i)=>s+(Number(i.qty)||0),0);
  const plas=ITEMS.filter(i=>i.loc==="plastico").length;
  const amar=ITEMS.filter(i=>i.loc==="amarilla").length;
  countsEl.innerHTML=
    `<span class="pill"><b>${refs}</b> referencias</span>`+
    `<span class="pill"><b>${units}</b> unidades</span>`+
    `<span class="pill"><span class="swatch" style="background:${LOCS.plastico.color}"></span>${plas} plástico</span>`+
    `<span class="pill"><span class="swatch" style="background:${LOCS.amarilla.color}"></span>${amar} amarilla</span>`;
}

/* ---- Render de la lista ---- */
function matches(it){
  if(filterCat!=="todos" && it.cat!==filterCat) return false;
  if(filterLoc!=="todos" && it.loc!==filterLoc) return false;
  if(query){
    const hay=(it.n+" "+(it.model||"")+" "+(it.notes||"")+" "+(it.spec||"")+" "+
      (CATS[it.cat]?.label||"")).toLowerCase();
    if(!hay.includes(query)) return false;
  }
  return true;
}
function render(){
  renderFilters();
  renderCounts();
  const shown=ITEMS.filter(matches);
  if(shown.length===0){
    listEl.innerHTML=`<div class="empty">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
      Nada por aquí.<br>Prueba otro filtro o añade un componente con el botón +.</div>`;
    hintEl.textContent="";
    return;
  }
  /* agrupar por categoría en el orden definido */
  const byCat={};
  for(const it of shown){(byCat[it.cat]=byCat[it.cat]||[]).push(it);}
  let html="";
  for(const c of CAT_ORDER){
    if(!byCat[c])continue;
    html+=`<div class="group-label">${CATS[c].label}</div>`;
    byCat[c].sort((a,b)=>a.n.localeCompare(b.n,'es'));
    for(const it of byCat[c]) html+=cardHTML(it);
  }
  listEl.innerHTML=html;
  listEl.querySelectorAll("[data-id]").forEach(el=>{
    el.onclick=()=>openDetail(Number(el.dataset.id));
  });
  hintEl.textContent="Los datos se guardan en este dispositivo · Añádela a tu pantalla de inicio para usarla como app";
}
function cardHTML(it){
  const cat=CATS[it.cat]||{label:it.cat,color:"#c88a4a"};
  const loc=LOCS[it.loc];
  const st=STATES[it.state];
  const qtyCls=(Number(it.qty)===1)?"qty single":"qty";
  return `<div class="card" data-id="${it.id}" style="--cat-color:${cat.color}">
    <div class="row1">
      <div class="name">${esc(it.n)}</div>
      <div class="${qtyCls}">×${it.qty}</div>
    </div>
    <div class="meta">
      <span class="tag cat">${cat.label}</span>
      ${it.model?`<span class="tag model">${esc(it.model)}</span>`:""}
      ${loc?`<span class="tag loc"><span class="swatch" style="background:${loc.color}"></span>${loc.label}</span>`:""}
      ${st?`<span class="tag ${st.cls}">${st.label}</span>`:""}
    </div>
  </div>`;
}

/* ============================================================
   Hoja de detalle / edición
   ============================================================ */
function openSheet(){scrim.classList.add("open");sheet.classList.add("open");}
function closeSheet(){scrim.classList.remove("open");sheet.classList.remove("open");}
scrim.onclick=closeSheet;

function openDetail(id){
  const it=ITEMS.find(x=>x.id===id);
  if(!it)return;
  const cat=CATS[it.cat]||{label:it.cat,color:"#c88a4a"};
  const loc=LOCS[it.loc], st=STATES[it.state];
  sheetBody.innerHTML=`
    <h2>${esc(it.n)}</h2>
    <div class="qty-stepper">
      <button id="dec" aria-label="Quitar una unidad">−</button>
      <span class="val" id="qval">${it.qty}</span>
      <button id="inc" aria-label="Añadir una unidad">+</button>
    </div>
    <div style="height:16px"></div>
    <div class="detail-block"><div class="k">Categoría</div>
      <div class="v" style="color:${cat.color}">${cat.label}</div></div>
    ${it.model?`<div class="detail-block"><div class="k">Modelo / referencia</div><div class="v">${esc(it.model)}</div></div>`:""}
    ${it.spec?`<div class="detail-block"><div class="k">Voltaje / valor</div><div class="v">${esc(it.spec)}</div></div>`:""}
    <div class="two">
      <div class="detail-block"><div class="k">Ubicación</div>
        <div class="v">${loc?`<span class="swatch" style="background:${loc.color};margin-right:6px"></span>${loc.label}`:"—"}</div></div>
      <div class="detail-block"><div class="k">Estado</div>
        <div class="v ${st?st.cls:''}">${st?st.label:"—"}</div></div>
    </div>
    ${it.notes?`<div class="detail-block"><div class="k">Notas técnicas</div><div class="v notes">${esc(it.notes)}</div></div>`:""}
    <div class="sheet-actions">
      <button class="btn ghost" id="editBtn">Editar</button>
      <button class="btn danger" id="delBtn">Eliminar</button>
    </div>`;
  openSheet();
  let liveQty=it.qty;
  const qval=$("#qval");
  $("#inc").onclick=async()=>{liveQty++;qval.textContent=liveQty;
    it.qty=liveQty;await put(it);renderCounts();};
  $("#dec").onclick=async()=>{if(liveQty>0)liveQty--;qval.textContent=liveQty;
    it.qty=liveQty;await put(it);renderCounts();};
  $("#editBtn").onclick=()=>openForm(it);
  $("#delBtn").onclick=async()=>{
    if(confirm(`¿Eliminar "${it.n}" del inventario?`)){
      await del(it.id);ITEMS=await getAll();closeSheet();render();
    }
  };
}

function openForm(existing){
  const it=existing||{n:"",cat:"placa",qty:1,model:"",state:"usado",spec:"",loc:"plastico",notes:""};
  const catOpts=CAT_ORDER.map(c=>`<option value="${c}" ${it.cat===c?"selected":""}>${CATS[c].label}</option>`).join("");
  const locOpts=Object.entries(LOCS).map(([k,v])=>`<option value="${k}" ${it.loc===k?"selected":""}>${v.label}</option>`).join("");
  const stOpts=Object.entries(STATES).map(([k,v])=>`<option value="${k}" ${it.state===k?"selected":""}>${v.label}</option>`).join("");
  sheetBody.innerHTML=`
    <h2>${existing?"Editar":"Nuevo componente"}</h2>
    <div class="field"><label>Nombre</label>
      <input id="f_n" value="${escAttr(it.n)}" placeholder="p. ej. Arduino UNO"></div>
    <div class="two">
      <div class="field"><label>Categoría</label><select id="f_cat">${catOpts}</select></div>
      <div class="field"><label>Cantidad</label>
        <input id="f_qty" type="number" min="0" inputmode="numeric" value="${it.qty}"></div>
    </div>
    <div class="field mono"><label>Modelo / referencia</label>
      <input id="f_model" value="${escAttr(it.model||"")}" placeholder="opcional"></div>
    <div class="field mono"><label>Voltaje / valor</label>
      <input id="f_spec" value="${escAttr(it.spec||"")}" placeholder="p. ej. 5V, 210 kΩ"></div>
    <div class="two">
      <div class="field"><label>Ubicación</label><select id="f_loc">${locOpts}</select></div>
      <div class="field"><label>Estado</label><select id="f_state">${stOpts}</select></div>
    </div>
    <div class="field"><label>Notas técnicas</label>
      <textarea id="f_notes" placeholder="Advertencias de uso, pinout, compatibilidad…">${esc(it.notes||"")}</textarea></div>
    <div class="sheet-actions">
      <button class="btn ghost" id="cancelBtn">Cancelar</button>
      <button class="btn primary" id="saveBtn">Guardar</button>
    </div>`;
  openSheet();
  $("#cancelBtn").onclick=()=>existing?openDetail(existing.id):closeSheet();
  $("#saveBtn").onclick=async()=>{
    const name=$("#f_n").value.trim();
    if(!name){$("#f_n").focus();$("#f_n").style.borderColor="var(--danger)";return;}
    const rec={
      ...(existing||{}),
      n:name,
      cat:$("#f_cat").value,
      qty:Math.max(0,parseInt($("#f_qty").value)||0),
      model:$("#f_model").value.trim(),
      spec:$("#f_spec").value.trim(),
      loc:$("#f_loc").value,
      state:$("#f_state").value,
      notes:$("#f_notes").value.trim(),
    };
    const id=await put(rec);
    if(!existing) rec.id=id;
    ITEMS=await getAll();
    render();
    openDetail(existing?existing.id:id);
  };
}

$("#add").onclick=()=>openForm(null);
$("#q").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render();});

/* ---- exportar CSV ---- */
function csvCell(v){
  const s=String(v==null?"":v);
  return /[",\n;]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function exportCSV(){
  const headers=["Nombre","Categoría","Cantidad","Modelo/referencia",
    "Voltaje/valor","Ubicación","Estado","Notas"];
  const rows=[...ITEMS]
    .sort((a,b)=>CAT_ORDER.indexOf(a.cat)-CAT_ORDER.indexOf(b.cat)||a.n.localeCompare(b.n,'es'))
    .map(it=>[
      it.n,
      CATS[it.cat]?.label||it.cat,
      it.qty,
      it.model||"",
      it.spec||"",
      LOCS[it.loc]?.label||it.loc||"",
      STATES[it.state]?.label||it.state||"",
      it.notes||"",
    ].map(csvCell).join(","));
  // BOM para que Excel abra bien los acentos
  const csv="\uFEFF"+headers.map(csvCell).join(",")+"\n"+rows.join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const d=new Date();
  const stamp=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const a=document.createElement("a");
  a.href=url;a.download=`inventario-taller-${stamp}.csv`;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
}
$("#exportBtn").onclick=exportCSV;

/* ---- utilidades ---- */
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function escAttr(s){return String(s).replace(/"/g,"&quot;").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

/* ---- arranque ---- */
(async function(){
  try{
    await openDB();
    await seedIfEmpty();
    ITEMS=await getAll();
    render();
  }catch(err){
    listEl.innerHTML=`<div class="empty">No se pudo abrir el almacén local.<br>${esc(err.message||err)}</div>`;
  }
})();
</script>
</body>
</html>
